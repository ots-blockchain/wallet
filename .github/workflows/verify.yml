name: Verify wallet
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package.json
            server/package.json
      - run: npm install
      - run: npm --prefix server install
      - run: npm test
      - run: npm run build
